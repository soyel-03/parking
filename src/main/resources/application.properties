spring.application.name=decathlon-smart-parking
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/parkingdb;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,info

supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.jwks-url=${SUPABASE_JWKS_URL:}
